spring.application.name=ecomCheckOutService
server.port=8085

# Eureka server
# Register this service with the local Eureka server used by the platform.
eureka.client.serviceUrl.defaultZone=http://localhost:5000/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Config Server (optional) - imports configuration from Config Server if available
# Adjust URI to your Config Server instance. Using optional: prevents startup failure when config server is unreachable.
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.fail-fast=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Razorpay configuration - set these via environment or config server (do NOT commit real keys)
razorpay.keyId=rzp_test_TYpMA6kmqLXOc7
razorpay.keySecret=rzp_test_TYpMA6kmqLXOc7
