spring.application.name=ecomApiGateWay

# ---- Eureka server -------
eureka.client.serviceUrl.defaultZone=http://localhost:5000/eureka

# ----- Eureka server For running on docker and accessing eureka running on other docker container------
#eureka.client.serviceUrl.defaultZone=http://host.docker.internal:5000/eureka
#eureka.client.instance.preferIpAddress=true
server.port=4000

# Remote Routing
spring.cloud.gateway.discovery.locator.enabled=true
# Product List must use the explicit, rate-limited route, not a discovery shortcut.
spring.cloud.gateway.discovery.locator.include-expression=!serviceId.equalsIgnoreCase('ecomProductList')

# Use a standalone connection to the single cluster-enabled Redis node. Cluster
# discovery would advertise Pod addresses and is unnecessary while one node owns all slots.
spring.data.redis.host=${REDIS_HOST:ecom-redis.default.svc.cluster.local}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

spring.cloud.gateway.routes[0].id=ECOMPRODUCTLIST
spring.cloud.gateway.routes[0].metadata.rate-limit-scope=product-list
spring.cloud.gateway.routes[0].uri=http://ecom-product-list.default.svc.cluster.local:9203
spring.cloud.gateway.routes[0].predicates[0].name=Path
spring.cloud.gateway.routes[0].predicates[0].args.pattern=/ecom/**
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@scopedClientIpKeyResolver}
spring.cloud.gateway.routes[0].filters[0].args.rate-limiter=#{@redisRateLimiter}
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1

spring.cloud.gateway.routes[1].id=ECOMCHECKOUT
spring.cloud.gateway.routes[1].uri=http://localhost:8085
spring.cloud.gateway.routes[1].predicates[0].name=Path
spring.cloud.gateway.routes[1].predicates[0].args.pattern=/checkout/**

spring.cloud.gateway.routes[2].id=ECOMCHECKOUTWEBHOOK
spring.cloud.gateway.routes[2].uri=http://localhost:8085
spring.cloud.gateway.routes[2].predicates[0].name=Path
spring.cloud.gateway.routes[2].predicates[0].args.pattern=/webhook/**

spring.cloud.gateway.routes[3].id=ECOMACCOUNTS
spring.cloud.gateway.routes[3].uri=http://localhost:8086
spring.cloud.gateway.routes[3].predicates[0].name=Path
spring.cloud.gateway.routes[3].predicates[0].args.pattern=/account-addresses/**
#spring.cloud.gateway.routes[3].filters[0].name=RewritePath
#spring.cloud.gateway.routes[3].filters[0].args.regexp=/account-addresses/(?<segment>.*)
#spring.cloud.gateway.routes[3].filters[0].args.replacement=/ecom/account-addresses/${segment}

spring.cloud.gateway.routes[4].id=ECOMACCOUNTSLOGIN
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0].name=Path
spring.cloud.gateway.routes[4].predicates[0].args.pattern=/users/**

#spring.cloud.gateway.routes[5].id=ECOMACCOUNTSREGISTER
#spring.cloud.gateway.routes[5].uri=http://localhost:8086
#spring.cloud.gateway.routes[5].predicates[0].name=Path
#spring.cloud.gateway.routes[5].predicates[0].args.pattern=/users/register

spring.cloud.gateway.defaultFilters=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
# Ignore the compiler error. Eclipse doesn't understand this.
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
#http://localhost:4200 
#, http://127.0.0.1:4200
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowed-headers=*

# allowCredentials will not work with wild allowOrgins value as '*'. we need to provide specific lost for domains in this case.
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

org.springframework.cloud.gateway=DEBUG
org.springframework.http.server.reactive=DEBUG
org.springframework.web.reactive=DEBUG
org.springframework.boot.autoconfigure.web=DEBUG
reactor.netty=DEBUG
redisratelimiter=DEBUG
-Dreactor.netty.http.server.accessLogEnabled=true

logging.level.org.springframework.web.HttpLogging=TRACE
logging.level.reactor.netty.http.server=DEBUG
logging.level.reactor.netty.http.client=DEBUG

spring.cloud.gateway.httpserver.wiretap=true
