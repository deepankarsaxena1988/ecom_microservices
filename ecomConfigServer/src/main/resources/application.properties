server.port=8888
spring.application.name=ecomConfigServer
# Primary config repo (keeps existing behavior)
spring.cloud.config.server.git.uri=https://github.com/deepankarsaxena1988/ecomConfig.git
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.basedir=/tmp/config-repos
# Additional repositories: add ecomProductListConfig so ecomProductList configs are served
spring.cloud.config.server.git.repos.ecomProductList.uri=https://github.com/deepankarsaxena1988/ecomProductListConfig.git
spring.cloud.config.server.git.repos.ecomProductList.pattern=ecomProductList*
spring.cloud.config.server.git.repos.ecomProductList.default-label=main
spring.cloud.config.server.git.repos.ecomProductList.clone-on-start=true
spring.cloud.config.server.git.repos.ecomProductList.basedir=/tmp/config-repos/ecomProductListConfig
spring.cloud.config.server.git.default-label=main
eureka.client.serviceUrl.defaultZone=http://localhost:5000/eureka

# Serve local configs from /tmp/config-repos as fallback for specific apps
spring.cloud.config.server.native.searchLocations=file:/tmp/config-repos

## Additional repo for ecomCheckOutService configs (create repo ecomCheckOutConfig or point to existing)
#spring.cloud.config.server.git.repos.ecomCheckOut.uri=file:../ecomCheckOutConfig
spring.cloud.config.server.git.repos.ecomCheckOut.uri=https://github.com/deepankarsaxena1988/ecomCheckOutConfig.git
spring.cloud.config.server.git.repos.ecomCheckOut.pattern=ecomCheckOut*
spring.cloud.config.server.git.repos.ecomCheckOut.default-label=main
spring.cloud.config.server.git.repos.ecomCheckOut.clone-on-start=true
spring.cloud.config.server.git.repos.ecomCheckOut.basedir=/tmp/config-repos/ecomCheckOutConfig

spring.cloud.config.server.git.repos.ecomOrderSummary.uri=https://github.com/deepankarsaxena1988/ecomOrderSummaryConfig.git
