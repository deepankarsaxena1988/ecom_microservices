server.port=8888
spring.application.name=ecomConfigServer
# Primary config repo (keeps existing behavior)
spring.cloud.config.server.git.uri=https://github.com/deepankarsaxena1988/ecomConfig.git
spring.cloud.config.server.git.clone-on-start=true
