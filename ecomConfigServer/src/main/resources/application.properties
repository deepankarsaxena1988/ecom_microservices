spring.cloud.config.server.git.repos.ecomOrderSummary.basedir=/tmp/config-repos/ecomOrderSummaryConfig

spring.cloud.config.server.git.repos.ecomAccounts.uri=https://github.com/deepankarsaxena1988/ecomAccountsConfig.git
spring.cloud.config.server.git.repos.ecomAccounts.pattern=ecomAccounts*
spring.cloud.config.server.git.repos.ecomAccounts.default-label=main
