# Config for ecomCheckOutService (dev)
# Database (MySQL) - points to ecomCheckoutDB container on host port 3311
spring.datasource.url=jdbc:mysql://host.docker.internal:3311/ecomCheckoutDB?useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ecomUser
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Razorpay keys - set real values in Config Server or environment; do NOT commit production keys here
razorpay.keyId=REPLACE_WITH_KEY_ID
razorpay.keySecret=REPLACE_WITH_KEY_SECRET
razorpay.webhook.secret=REPLACE_WITH_WEBHOOK_SECRET
