services:
  ecom-order-summary-db:
    build: .
    container_name: ecom-order-summary-db
    ports:
      - "3313:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ecomOrderSummaryDB
      MYSQL_USER: ecomUser
      MYSQL_PASSWORD: root123
    volumes:
      - ecom_order_summary_db_data:/var/lib/mysql

volumes:
  ecom_order_summary_db_data:
