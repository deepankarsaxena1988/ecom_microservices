services:
  ecom-account-addresses-db:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecom-account-db:local
    container_name: ecom-account-db
    restart: unless-stopped
    ports:
      - "3312:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ecomAccountsDB
      MYSQL_USER: ecomUser
      MYSQL_PASSWORD: root123
    volumes:
      - ecom_account_db_data:/var/lib/mysql

volumes:
  ecom_account_db_data:

# Rebuild and recreate the container when Dockerfile or init SQL files change:
# docker compose up -d --build --force-recreate
# Use this when the existing DB container is already running and you need the script changes to take effect.
