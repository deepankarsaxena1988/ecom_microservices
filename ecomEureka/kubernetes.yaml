apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-eureka
  labels:
    app: ecom-eureka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecom-eureka
  template:
    metadata:
      labels:
        app: ecom-eureka
    spec:
      containers:
        - name: ecom-eureka
          image: deepankarsaxena/ecomeureka:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: SPRING_APPLICATION_NAME
              value: ecomEureka
            - name: SERVER_PORT
              value: "5000"
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://ecom-config-server:8888
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: EUREKA_CLIENT_REGISTERWITHEUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCHREGISTRY
              value: "false"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://ecom-eureka:5000/eureka
            - name: EUREKA_INSTANCE_HOSTNAME
              value: ecom-eureka
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-eureka
  labels:
    app: ecom-eureka
spec:
  selector:
    app: ecom-eureka
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  type: LoadBalancer
